name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          swift --version

      - name: Import the signing certificate
        env:
          P12: ${{ secrets.TABBY_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.TABBY_SIGNING_PASSWORD }}
        run: |
          if [ -z "$P12" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::error::Add the TABBY_SIGNING_P12 and TABBY_SIGNING_PASSWORD secrets. Without them macOS treats every download as a different app and asks for Accessibility again."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/tabby-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/tabby-signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/tabby-signing.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/tabby-signing.p12"

      - name: Test
        run: swift test --package-path Packages/TabbyKit

      - name: Package
        run: scripts/release.sh "${GITHUB_REF_NAME#v}"

      - name: Verify the signature
        run: |
          codesign -dr - build/Tabby.app 2>&1 | tee /dev/stderr | grep -q "certificate leaf" || {
            echo "::error::Tabby.app is not signed with the project certificate."
            exit 1
          }

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Tabby.zip dist/Tabby.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tabby ${GITHUB_REF_NAME#v}" \
            --notes-file dist/release-notes.md
